name: SJTU Bot 30min Run

on:
  schedule:
    # 每 10 分钟运行一次 (UTC 时间，0 0 * * * 是北京时间 8 点)
    - cron: '*/10 * * * *'
  workflow_dispatch: # 允许你手动点击按钮测试

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: 安装依赖
      run: |
        pip install requests beautifulsoup4 schedule  

    - name: 运行机器人
      env:
        # 这里的名字必须和你之前在 gh secret set 里的名字完全一致
        CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
        SC_KEY: ${{ secrets.SC_KEY }}
      run: python bot_pro.py

    - name: 自动保存 history.txt (记忆)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add history.txt
        # 只有在 history.txt 有变动时才提交，防止报错
        git diff --quiet && git diff --staged --quiet || (git commit -m "Update history [skip ci]" && git push)